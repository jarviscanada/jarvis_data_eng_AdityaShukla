professional_experience:
  #Write your Jarvis role as a professional experience rather than training.

  - title: "Business Analyst"
    company: "Jarvis"
    duration: "April 2025-present"
    description: "As a Business Analyst, I work closely with cross-functional internal teams to gather requirements, analyze system processes, and support the delivery of scalable solutions using technologies such as Linux, Bash scripting, PostgreSQL, Docker, and Git. I translate business needs into clear technical documentation and support system design and implementation to enhance operational efficiency. Operating within an Agile/Scrum environment, I actively participate in sprint planning, daily stand-ups, reviews, and retrospectives to ensure team alignment and continuous process improvement."

  - title: "Business Analyst"
    company: "Ace Management"   
    duration: "September 2024 - March 2025"   
    description: "Analyzed the existing business and sales operations workflows to identify inefficiencies and improvement opportunities. I documented these workflows using BPMN diagrams, which helped visualize and isolate key bottlenecks affecting performance and documentation consistency. In collaboration with Managers and Business Analysts, I developed a streamlined Rogers sales program, supported by standardized sales record templates and documentation rules to ensure operational consistency. To enable smooth rollout and training, I created user stories, use cases, and process documentation for Business Developers (BDs), along with a structured post-sales engagement guide focused on improving customer retention through defined follow-up steps. Using Salesforce CRM, I tracked KPIssuch as daily outreach, presentation volume, and conversion ratesto assess performance and recommend targeted coaching modules. I also analyzed pricing trends and competitor data to support real-time pricing requests, giving us a competitive edge. These efforts enabled each BDA to consistently achieve 50 daily interactions, 4 product presentations, and 12 sales, generating weekly team revenue of $4,000$5,000 and monthly revenue between $16,000$20,000, based on team size and product value"


  - title: "Business Analyst"
    company: "Mozwebmedia"
    duration: "April 2021 -  September 2022"
    description: "At MozwebMedia, I collaborated with business owners to define goals for expanding their digital presence through website and app development. I analyzed user experience issues using customer journey mapping and feedback to identify pain points in navigation and design. To address scalability, I worked with developers to assess system architecture and data flow, ensuring performance aligned with growth plans. I conducted stakeholder interviews and process walkthroughs to map workflows, then used BPMN diagrams to highlight bottlenecks and inefficiencies. Based on these findings, I created Business Requirement Documents (BRDs), System Requirement Documents (SRDs), user stories, use cases, and user flow diagrams to guide development and ensure alignment across marketing, design, and engineering teams. Operating in an Agile environment, I participated in sprint planning, daily stand-ups, sprint reviews, and retrospectives to maintain visibility and adaptability. I managed scope changes by conducting impact analysis, updating requirements, and coordinating with cross-functional teams to ensure smooth delivery. I also prepared training materials to support onboarding and ensure process clarity for internal teams and clients. This structured approach improved team collaboration, reduced development cycles, and ensured consistent delivery aligned with client expectations."


