#List of Jarvis projects
jarvis_projects:
  - name: "Linux  Cluster Monitor Project "
    git_url: "/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: The Linux Cluster Monitoring Agent is a Bash-scripted MVP designed to help the Linux Cluster Administration team at Jarvis automate server monitoring. It collects hardware specs and real-time resource usage data from Linux nodes, storing it in a PostgreSQL database running in a Docker container. Scripts (host_info.sh and host_usage.sh) capture static and dynamic data, respectively, with host_usage.sh running every minute via crontab. The system supports automated data logging, centralized storage, and performance analysis, significantly reducing manual monitoring. Git and Docker were used for version control and containerized deployment, ensuring portability and maintainability.

  - name: "RDBMS_SQL Project "
    git_url: "/sql"
    description: A SQL-based project designed to manage a country club's data, including members, facilities, and booking history. The system supports core database operations such as inserting records, removing members, updating facility costs, analyzing monthly bookings, and identifying popular facilities.
     
  - name: "BSA Project"
    git_url: "/BSA"
    description: A hands-on project focused on requirements gathering, system analysis, and documentation. I developed a Business Requirements Document (BRD) for a Linux Cluster Monitoring Agent, outlining business needs, technical specifications, and implementation strategy using PostgreSQL, Docker, and Bash scripting. Additionally, I created a System Requirements Document (SRD) for a mobile-first Retail Investor Stock Trading Application, detailing functional and non-functional requirements, user needs, and compliance standards. This project strengthened my skills in stakeholder communication, Agile methodology, SQL, and end-to-end documentation aligned with industry practices.
 
  - name: "Python Data Analytics Project "
    git_url: "/python_data_anlytics"
    description: Developed a data analytics pipeline for the London Gift Shop (LGS) using Python, Jupyter Notebook, and PostgreSQL. The project ingested and transformed a historical SQL retail dataset into actionable insights. Implemented RFM segmentation, customer acquisition analysis, and sales trend visualizations. Utilized Pandas, NumPy, and Matplotlib for data wrangling and plotting. PostgreSQL ran inside a Docker container simulating an OLAP environment, and Git was used for version control. The solution supports data-driven decision-making in marketing and operations.

  - name: "Power BI Dashboard Project"
    git_url: "power_bi"
    description: In this Power BI project, three distinct dashboards were developed to address different analytical needs. The Beverage Dashboard offers detailed insights into beverage sales performance, including trends over time, top products, and customer segmentation, supporting marketing and inventory decisions. The Data Professionals Survey Report visualizes responses from a 2022 survey of over 600 data professionals, highlighting career roles, job satisfaction, demographics, and industry trends to inform workforce analytics. Finally, the Stocks Dashboard integrates live stock data via the Alpha Vantage API, providing comprehensive views of daily stock prices, trading volume, key financial ratios, and earnings estimates, with dynamic filtering options to assist in investment analysis.

  - name: "Hadoop Big Data Analytics Project"
    git_url: "hadoop"
    description: Implemented a scalable Hadoop cluster on Google Cloud Platform (1 master, 2 worker nodes) to evaluate Hadoop as an alternative to legacy analytics tools like SAP and R. Designed and validated distributed storage and processing workflows using HDFS, YARN, and Hive, with interactive exploration in Zeppelin notebooks. Performed benchmarking on a 1TB stock trades dataset, reducing execution times from hours to minutes through distributed computing. Optimized Hive queries with year-based partitioning, Parquet storage (shrinking data from 1.7 GB to 263 MB), and the Tez execution engine, achieving up to 45x faster query performance. Explored MapReduce, Tez, and HiveQL to compare imperative vs. declarative SQL approaches in large-scale analytics.

